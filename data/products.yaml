# Known products, mapped to the actives they are known for.
#
# WHY THIS EXISTS
# A shelf photograph shows the front of a bottle. The ingredient list is on the
# back. Without a name-to-actives lookup the photo path only works if someone
# photographs the reverse of all twenty products, which nobody does — the first
# real shelf tested against this app produced eight product names, zero
# ingredients, and an audit that found nothing and looked like a pass.
#
# This file was cut from the original plan on the argument that parsing labels
# generalises better. It does generalise better. It also does not work on the
# input people actually supply.
#
# WHAT IS AND IS NOT IN HERE
# Only actives a product is openly formulated around and markets on the front
# of the pack — the niacinamide in CeraVe's cleanser, the retinol in a product
# called "Retinol 0.5%". Not a full INCI transcription, and not a guess at
# trace ingredients.
#
# A label always wins. The catalogue is consulted only when no ingredients
# could be read, and the result page says which products were matched this way
# so a user can check the bottle.
#
# STATUS: unverified, like the rules. A wrong entry invents a conflict, or
# hides one. Spot-check the brands you care about before relying on it.
#
# TYPICAL PRICES
# typical_price_usd is approximate US retail, used only when the user did not
# say what they paid. Calibrated against a handful of live listings
# (CeraVe Foaming Cleanser ~$13.68 Walmart, SkinCeuticals C E Ferulic $182
# DermFND, SK-II Facial Treatment Essence $99/2.5oz Dermstore, all October
# 2026) and filled out from there, so treat them as the right order of
# magnitude rather than a quote.
#
# They are good enough to tell someone roughly what is sitting unused. They
# are NOT good enough to support a measured claim about money wasted — that
# needs what a person actually paid, and the page labels which is which.


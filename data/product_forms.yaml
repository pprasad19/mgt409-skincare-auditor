# Canonical application order. Lower rank goes on the skin first.
#
# Two principles decide these numbers:
#   - water before oil, thin before thick, so each layer can still penetrate
#   - anything whose job is to seal (SPF in the morning, occlusives at night)
#     has to be last or it seals the others out
#
# `times` limits a form to part of the day. Everything else may appear in both.
#
# PROVENANCE — these thirteen numbers decide the order of every routine this
# app produces, so they carry the same review field as the rules table.
# Three are published AAD guidance. The other ten are the industry
# layering convention — thinnest to thickest, water before oil — which is a
# real and near-universal convention but not a clinical finding, and is
# marked `reasoned` rather than dressed up as evidence.

forms:
  - id: oil_cleanser
    name: Cleansing oil or balm
    rank: 5
    times: [pm]
    note: The first half of a double cleanse. Dissolves sunscreen and makeup; a water-based cleanser still follows it.
    source: "Not in the AAD order, which does not treat double cleansing. Added 25 Oct 2026 after a tester pointed out that a cleansing oil was being handled as an ordinary cleanser: placed in the morning routine, and counted as satisfying the shelf's need for a cleanser. It is neither. An oil or balm cleanser emulsifies sunscreen and makeup and is rinsed away by the water-based cleanser that follows, which is why it is evening-only and ranked before `cleanser` rather than instead of it. The two-step sequence is a Korean-routine convention rather than a clinical finding, so this is `reasoned`; what is NOT a judgement call is that an oil cleanser does not replace a face wash."
    review: reasoned


  - id: cleanser
    name: Cleanser
    rank: 10
    times: [am, pm]
    source: "AAD 'Should I apply my skin care products in a certain order?': cleanse, then treatments, then moisturiser and/or sunscreen, then makeup. AAD also states sunscreen goes after other skincare and beneath makeup. Cleanser first is the one step every published order agrees on. Reviewed 25 Oct 2026."
    review: verified


  - id: exfoliant
    name: Exfoliant (rinse-off or wipe-off)
    rank: 15
    times: [pm]
    note: Leave-on acids are treatments, not this form. This is the rinse-off kind.
    source: "Industry layering convention — thinnest to thickest, water-based before oil-based — rather than a clinical finding. No study ranks these against each other. The convention is near-universal in published routines and the consequence of getting it wrong is a suboptimal order, not a safety problem. Placed immediately after cleansing because a rinse-off exfoliant is a cleansing-stage product; the evening restriction follows from the photosensitivity rules SKA-082 and SKA-083, which are themselves sourced. Reviewed 25 Oct 2026."
    review: reasoned


  - id: toner
    name: Toner
    rank: 20
    times: [am, pm]
    source: "Industry layering convention — thinnest to thickest, water-based before oil-based — rather than a clinical finding. No study ranks these against each other. The convention is near-universal in published routines and the consequence of getting it wrong is a suboptimal order, not a safety problem. Reviewed 25 Oct 2026."
    review: reasoned


  - id: essence
    name: Essence
    rank: 30
    times: [am, pm]
    source: "Industry layering convention — thinnest to thickest, water-based before oil-based — rather than a clinical finding. No study ranks these against each other. The convention is near-universal in published routines and the consequence of getting it wrong is a suboptimal order, not a safety problem. Essence sits between toner and serum by convention in Korean routines, which is where the category comes from. The distinction from a toner is not sharp. Reviewed 25 Oct 2026."
    review: reasoned


  - id: serum
    name: Serum
    rank: 40
    times: [am, pm]
    source: "Industry layering convention — thinnest to thickest, water-based before oil-based — rather than a clinical finding. No study ranks these against each other. The convention is near-universal in published routines and the consequence of getting it wrong is a suboptimal order, not a safety problem. Reviewed 25 Oct 2026."
    review: reasoned


  - id: treatment
    name: Treatment (leave-on active)
    rank: 45
    times: [am, pm]
    note: Where retinoids, leave-on acids and benzoyl peroxide land.
    source: "Industry layering convention — thinnest to thickest, water-based before oil-based — rather than a clinical finding. No study ranks these against each other. The convention is near-universal in published routines and the consequence of getting it wrong is a suboptimal order, not a safety problem. Ranked just after serum: both are leave-on actives and the split between them is about potency rather than texture. Reviewed 25 Oct 2026."
    review: reasoned


  - id: eye
    name: Eye cream
    rank: 50
    times: [am, pm]
    source: "Industry layering convention — thinnest to thickest, water-based before oil-based — rather than a clinical finding. No study ranks these against each other. The convention is near-universal in published routines and the consequence of getting it wrong is a suboptimal order, not a safety problem. Eye cream placement is the least settled of these: published routines disagree about whether it precedes or follows moisturiser. Placed before, so a lighter eye product is not applied over a heavier face cream. Reviewed 25 Oct 2026."
    review: reasoned


  - id: moisturiser
    name: Moisturiser
    rank: 60
    times: [am, pm]
    source: "AAD 'Should I apply my skin care products in a certain order?': cleanse, then treatments, then moisturiser and/or sunscreen, then makeup. AAD also states sunscreen goes after other skincare and beneath makeup. Moisturiser after treatments is explicit in the AAD order. Reviewed 25 Oct 2026."
    review: verified


  - id: oil
    name: Face oil
    rank: 70
    times: [pm]
    note: After moisturiser, because oil passes through cream but cream does not pass through oil.
    source: "Industry layering convention — thinnest to thickest, water-based before oil-based — rather than a clinical finding. No study ranks these against each other. The convention is near-universal in published routines and the consequence of getting it wrong is a suboptimal order, not a safety problem. Oil after water-based products is the clearest case of the thin-before-thick principle, since an oil layer is the one most likely to impede what follows. Reviewed 25 Oct 2026."
    review: reasoned


  - id: spf
    name: Sunscreen
    rank: 80
    times: [am]
    note: Always the final morning step.
    source: "AAD 'Should I apply my skin care products in a certain order?': cleanse, then treatments, then moisturiser and/or sunscreen, then makeup. AAD also states sunscreen goes after other skincare and beneath makeup. Sunscreen last among skincare is published guidance, and rank 80 places it after everything except the night-only occlusive, which never co-occurs with it. Note from SKA-080 that the reason is the published order rather than a demonstrated film disruption effect. Reviewed 25 Oct 2026."
    review: verified


  - id: occlusive
    name: Occlusive / sleeping mask
    rank: 90
    times: [pm]
    source: "Industry layering convention — thinnest to thickest, water-based before oil-based — rather than a clinical finding. No study ranks these against each other. The convention is near-universal in published routines and the consequence of getting it wrong is a suboptimal order, not a safety problem. Last at night for the same reason sunscreen is last in the morning: a layer whose job is to seal has to go on top. This is definitional rather than measured — see SKA-081. Reviewed 25 Oct 2026."
    review: reasoned


  - id: mask
    name: Treatment mask
    rank: 35
    times: [am, pm]
    note: Used occasionally rather than daily; slots after cleansing.
    # A mask is applied in half a minute and then left on. Without this the
    # routine told people to use a face mask for 30 seconds, because the
    # only duration a step could carry was how long you spend applying it
    # — and StepApplication.seconds is capped at 120, so a 15-minute mask
    # was not expressible at all. Ten minutes is the bottom of the usual
    # range and the packet wins; the page says so rather than implying
    # this number came from somewhere it did not.
    # NOT a duration. The app looks up how long this particular mask says
    # to stay on; this flag only says that a mask has a wearing time at
    # all, so a product whose time could not be found is shown as untimed
    # rather than given a number from nowhere. The 600 seconds that used
    # to sit here came out of my head, which is exactly the kind of
    # unsourced figure the rest of this table exists to avoid.
    dwell_required: true
    dwell_note: follow the packet — and do not sleep in a clay mask
    source: "Industry layering convention — thinnest to thickest, water-based before oil-based — rather than a clinical finding. No study ranks these against each other. The convention is near-universal in published routines and the consequence of getting it wrong is a suboptimal order, not a safety problem. Ranked before serums because a treatment mask is applied to cleansed skin and removed before the rest of the routine. Reviewed 25 Oct 2026."
    review: reasoned


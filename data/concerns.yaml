# What people are trying to fix, and which actives address it.
#
# This is the other half of the audit. The rules table says what is wrong with
# the products someone already owns; this says what their shelf is missing for
# the thing they are actually trying to treat.
#
# HOW IT IS USED
# A concern only ever enters the system because the user confirmed it. A face
# photograph may *suggest* one — "there seems to be shine across the
# forehead" — but a suggestion is a question, and nothing acts on it until it
# is ticked. That keeps the model in the business of seeing and the table in
# the business of recommending.
#
# `observable` marks the concerns a photograph can reasonably raise. The rest
# are things only the person knows, and are offered as checkboxes.
#
# NO CONDITIONS HERE ON PURPOSE
# There is no acne, rosacea, eczema or melasma in this file. Those are
# diagnoses, this tool does not make them, and a concern list containing them
# would invite exactly the claim the escalation gates exist to prevent. What
# is here is what a person can see in a mirror and say for themselves.
#
# WHAT IS DELIBERATELY NOT HERE
# Prescription-only actives. tretinoin and hydroquinone address several of
# these concerns and appear in none of them, because suggesting that someone
# acquire a prescription drug is not this tool's business — and SKC-010
# escalates those same actives when a user already owns one. Recommending
# what you escalate for would be incoherent. Adapalene is listed under
# breakouts because Differin 0.1% is sold over the counter.
#
# Note that this is a convention in the data rather than something the code
# enforces: rules.suggest() does not filter on the prescription flag. Adding
# a prescription active to a concern here would make the app recommend it.
#
# PROVENANCE — reviewed 25 Oct 2026, same three states as the rules table.
# These mappings are well-trodden cosmeceutical ground rather than
# contested, but almost none of them was checked against a specific source,
# so most are `reasoned` rather than `verified`.

concerns:

  - id: oiliness
    label: Shine and oiliness
    observable: true
    observation_hint: visible shine, particularly across the forehead and nose
    addressed_by: [niacinamide, salicylic_acid, azelaic_acid]
    note: >-
      Oil-soluble exfoliants work inside the pore; niacinamide moderates oil
      production over time.
    source: "Salicylic acid's oil-solubility and niacinamide's effect on sebum are both standard cosmeceutical positions; neither was checked against a specific study here."
    review: reasoned


  - id: dryness
    label: Dryness and tightness
    observable: true
    observation_hint: visible flaking, dull or papery-looking patches
    addressed_by: [hyaluronic_acid, glycerin, ceramides, squalane, panthenol, urea]
    note: >-
      Humectants draw water in, ceramides and emollients stop it leaving again.
      Both halves matter.
    source: "Humectant plus occlusive-emollient is the standard framing of barrier repair and is the one the ceramide evidence behind SKA-060 rests on."
    review: reasoned


  - id: redness
    label: Redness and sensitivity
    observable: true
    observation_hint: visible redness, especially across the cheeks
    addressed_by: [centella, panthenol, allantoin, bisabolol, niacinamide, azelaic_acid, ceramides]
    note: >-
      Barrier support first. Strong actives often make this worse before
      anything else helps.
    source: "Barrier-support-first is the conventional approach. Centella, panthenol, allantoin and bisabolol are the standard soothing agents; PMC12494960 found panthenol and ceramides measurably reduce retinol irritation, which is the closest thing to a source any of these has."
    review: reasoned


  - id: texture
    label: Rough or uneven texture
    observable: true
    observation_hint: visible unevenness, small bumps, or a matte rough surface
    addressed_by: [glycolic_acid, lactic_acid, mandelic_acid, salicylic_acid, retinol]
    note: Exfoliation and cell turnover, introduced slowly.
    source: "Exfoliation and turnover. Prescription retinoids omitted deliberately — see the header."
    review: reasoned


  - id: dark_marks
    label: Dark marks and uneven tone
    observable: true
    observation_hint: visible darker patches or marks left behind after spots
    addressed_by: [l_ascorbic_acid, niacinamide, alpha_arbutin, tranexamic_acid, azelaic_acid, retinol]
    note: >-
      Slow work, and daily sunscreen does more for it than any active — without
      that the rest is undone faster than it accumulates.
    source: "The pathway reasoning is sourced on SKA-051 and SKA-052: pigment production and melanosome transfer are separate steps and the listed actives act at different points. The note that sunscreen does more than any active is supported by the photosensitivity sources behind SKA-082 and SKA-083."
    review: verified


  - id: breakouts
    label: Spots and congestion
    observable: true
    observation_hint: visible raised spots or congestion
    addressed_by: [salicylic_acid, benzoyl_peroxide, adapalene, azelaic_acid, niacinamide]
    note: >-
      If this is persistent or painful rather than occasional, it is a
      clinician's question, not this tool's.
    source: "Standard first-line actives. Adapalene included because Differin 0.1% is over the counter in the US; the note routes persistent or painful cases to a clinician rather than treating them here."
    review: reasoned


  - id: fine_lines
    label: Fine lines
    observable: false
    addressed_by: [retinol, retinaldehyde, l_ascorbic_acid, peptides, hyaluronic_acid]
    note: Retinoids have the strongest evidence; everything else is supporting.
    source: "Retinoids having the strongest evidence is the conventional position and is not contested; it was not checked against a specific trial here."
    review: reasoned


  - id: dullness
    label: Dullness
    observable: false
    addressed_by: [l_ascorbic_acid, glycolic_acid, lactic_acid, niacinamide]
    note: Antioxidants in the morning, gentle exfoliation at night.
    source: "Antioxidants plus gentle exfoliation. The weakest-evidenced concern on this list and the one whose definition is least precise."
    review: reasoned


  - id: sun_protection
    label: Protecting against sun damage
    observable: false
    addressed_by: [organic_uv_filters, zinc_oxide, titanium_dioxide, l_ascorbic_acid]
    note: >-
      The only item on this list that prevents rather than repairs, and the one
      that makes every other active worth using.
    source: "The only preventive entry. FDA guidance and the tretinoin label text behind SKA-082 and SKA-083 establish that the listed photosensitising actives raise UV sensitivity, which is what makes this the one that matters most. titanium_dioxide added 25 Oct 2026 — it was missing while zinc oxide was listed."
    review: verified


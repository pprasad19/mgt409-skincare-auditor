# Active ingredients the auditor knows about.
#
# PROVENANCE — read before trusting any row.
#
# This file was drafted from general dermatological knowledge and has NOT yet
# been checked against primary sources. Every entry carries `review: pending`.
# A row is only evidence once a human has checked it and changed that to
# `review: verified` with a real citation in `source`.
#
# This matters more than it looks. The project's central claim is that advice
# comes from an auditable table rather than from model recall. A table that was
# itself written by a model, and presented as verified, would make that claim
# false. Verify before publishing; say plainly in the report how many rows were
# checked and against what.
#
# FIELDS
#   id            stable key, referenced by interactions.yaml
#   class         grouping that most interaction rules operate on
#   ph_range      [min, max] where the ingredient is stable and effective
#   photosensitising  increases UV sensitivity -> implies PM use and daily SPF
#   time          am | pm | any — preferred time of day
#   pregnancy     ok | caution | avoid — input to the escalation gate, never advice
#   prescription  true if normally obtained through a clinician
#   potency       1-5, drives "too many strong actives at once" warnings

ingredients:

  # ---- Retinoids ----------------------------------------------------------
  - id: tretinoin
    name: Tretinoin
    inci: [Tretinoin, Retinoic Acid]
    aliases: [retin-a, retinoic acid]
    class: retinoid
    ph_range: [5.5, 6.5]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: true
    potency: 5
    note: Prescription retinoid. Presence should route the user to their clinician rather than to generated advice.
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  - id: adapalene
    name: Adapalene
    inci: [Adapalene]
    aliases: [differin]
    class: retinoid
    ph_range: [5.5, 6.5]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: false
    potency: 4
    note: Unusually photostable and oxidation-resistant for a retinoid, which makes it the documented exception to the benzoyl peroxide conflict.
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  - id: retinol
    name: Retinol
    inci: [Retinol]
    aliases: [vitamin a]
    class: retinoid
    ph_range: [5.0, 6.0]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: false
    potency: 3
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  - id: retinaldehyde
    name: Retinaldehyde
    inci: [Retinal, Retinaldehyde]
    aliases: [retinal]
    class: retinoid
    ph_range: [5.0, 6.0]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: false
    potency: 4
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  - id: retinyl_palmitate
    name: Retinyl palmitate
    inci: [Retinyl Palmitate]
    aliases: []
    class: retinoid
    ph_range: [5.0, 6.5]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: false
    potency: 1
    note: Weakest common retinoid ester. Often present in moisturisers without being marketed as a retinoid, which is a frequent source of accidental stacking.
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  # ---- Exfoliating acids --------------------------------------------------
  - id: glycolic_acid
    name: Glycolic acid
    inci: [Glycolic Acid]
    aliases: [aha]
    class: aha
    ph_range: [3.0, 4.0]
    photosensitising: true
    time: pm
    pregnancy: caution
    prescription: false
    potency: 4
    note: Smallest AHA molecule, so the most penetrating and the most irritating of the group.
    source: null
    review: pending

  - id: lactic_acid
    name: Lactic acid
    inci: [Lactic Acid]
    aliases: []
    class: aha
    ph_range: [3.0, 4.0]
    photosensitising: true
    time: pm
    pregnancy: caution
    prescription: false
    potency: 3
    source: null
    review: pending

  - id: mandelic_acid
    name: Mandelic acid
    inci: [Mandelic Acid]
    aliases: []
    class: aha
    ph_range: [3.0, 4.0]
    photosensitising: true
    time: pm
    pregnancy: caution
    prescription: false
    potency: 2
    note: Large molecule, slow penetration. The usual recommendation for sensitive skin that cannot tolerate glycolic.
    source: null
    review: pending

  - id: salicylic_acid
    name: Salicylic acid
    inci: [Salicylic Acid]
    aliases: [bha]
    class: bha
    ph_range: [3.0, 4.0]
    photosensitising: true
    time: pm
    pregnancy: caution
    prescription: false
    potency: 3
    note: Oil-soluble, so it works inside the pore rather than on the surface. Pregnancy guidance differs sharply between low-percentage leave-on products and peels.
    source: "PMC9823189 (acne in pregnancy, narrative review): low risk at acne-product concentrations, negligible absorption; avoid large areas, prolonged use, occlusion, damaged skin. PMC12591629: 44 cases of topical salicylate toxicity at the extremes. Reviewed 25 Oct 2026."
    review: verified

  - id: gluconolactone
    name: Gluconolactone
    inci: [Gluconolactone]
    aliases: [pha]
    class: pha
    ph_range: [3.0, 4.5]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 1
    source: null
    review: pending

  # ---- Vitamin C forms ----------------------------------------------------
  - id: l_ascorbic_acid
    name: L-ascorbic acid
    inci: [Ascorbic Acid, L-Ascorbic Acid]
    aliases: [vitamin c, laa]
    class: vitamin_c
    ph_range: [2.5, 3.5]
    photosensitising: false
    time: am
    pregnancy: ok
    prescription: false
    potency: 4
    note: Needs a low pH to penetrate, which is the root of most of its interaction conflicts. Oxidises readily.
    source: null
    review: pending

  - id: sodium_ascorbyl_phosphate
    name: Sodium ascorbyl phosphate
    inci: [Sodium Ascorbyl Phosphate]
    aliases: [sap]
    class: vitamin_c
    ph_range: [6.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 2
    note: Stable derivative at skin-neutral pH. Avoids the low-pH conflicts that L-ascorbic acid creates.
    source: null
    review: pending

  - id: thd_ascorbate
    name: Tetrahexyldecyl ascorbate
    inci: [Tetrahexyldecyl Ascorbate]
    aliases: [thd]

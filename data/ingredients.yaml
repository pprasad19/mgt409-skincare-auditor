# Active ingredients the auditor knows about.
#
# PROVENANCE — read before trusting any row.
#
# This file was drafted from general dermatological knowledge and has NOT yet
# been checked against primary sources. Every entry carries `review: pending`.
# A row is only evidence once a human has checked it and changed that to
# `review: verified` with a real citation in `source`.
#
# This matters more than it looks. The project's central claim is that advice
# comes from an auditable table rather than from model recall. A table that was
# itself written by a model, and presented as verified, would make that claim
# false. Verify before publishing; say plainly in the report how many rows were
# checked and against what.
#
# FIELDS
#   id            stable key, referenced by interactions.yaml
#   class         grouping that most interaction rules operate on
#   ph_range      [min, max] where the ingredient is stable and effective
#   photosensitising  increases UV sensitivity -> implies PM use and daily SPF
#   time          am | pm | any — preferred time of day
#   pregnancy     ok | caution | avoid — input to the escalation gate, never advice
#   prescription  true if normally obtained through a clinician
#   potency       1-5, drives "too many strong actives at once" warnings

ingredients:

  # ---- Retinoids ----------------------------------------------------------
  - id: tretinoin
    name: Tretinoin
    inci: [Tretinoin, Retinoic Acid]
    aliases: [retin-a, retinoic acid]
    class: retinoid
    ph_range: [5.5, 6.5]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: true
    potency: 5
    note: Prescription retinoid. Presence should route the user to their clinician rather than to generated advice.
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  - id: adapalene
    name: Adapalene
    inci: [Adapalene]
    aliases: [differin]
    class: retinoid
    ph_range: [5.5, 6.5]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: false
    potency: 4
    note: Unusually photostable and oxidation-resistant for a retinoid, which makes it the documented exception to the benzoyl peroxide conflict.
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  - id: retinol
    name: Retinol
    inci: [Retinol]
    aliases: [vitamin a]
    class: retinoid
    ph_range: [5.0, 6.0]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: false
    potency: 3
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  - id: retinaldehyde
    name: Retinaldehyde
    inci: [Retinal, Retinaldehyde]
    aliases: [retinal]
    class: retinoid
    ph_range: [5.0, 6.0]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: false
    potency: 4
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  - id: retinyl_palmitate
    name: Retinyl palmitate
    inci: [Retinyl Palmitate]
    aliases: []
    class: retinoid
    ph_range: [5.0, 6.5]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: false
    potency: 1
    note: Weakest common retinoid ester. Often present in moisturisers without being marketed as a retinoid, which is a frequent source of accidental stacking.
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure negligible, contraindication recommended as a precaution. Reviewed 25 Oct 2026."
    review: verified

  # ---- Exfoliating acids --------------------------------------------------
  - id: glycolic_acid
    name: Glycolic acid
    inci: [Glycolic Acid]
    aliases: [aha]
    class: aha
    ph_range: [3.0, 4.0]
    photosensitising: true
    time: pm
    pregnancy: caution
    prescription: false
    potency: 4
    note: Smallest AHA molecule, so the most penetrating and the most irritating of the group.
    source: "FDA Guidance for Industry: Labeling for Cosmetics Containing Alpha Hydroxy Acids (Jan 2005) — AHAs increase UV sensitivity during use and for up to a week after; FDA Beta Hydroxy Acids page says the same of glycolic acid. Formulation literature puts AHA working range at pH 3.0-4.0, matching ph_range. Pregnancy caution per PMC3114665 / PMC8884185: no human studies, animal adverse reproductive effects at high doses, one review suggesting 10% or below. Escalation added as SKC-004 on 25 Oct 2026."
    review: verified

  - id: lactic_acid
    name: Lactic acid
    inci: [Lactic Acid]
    aliases: []
    class: aha
    ph_range: [3.0, 4.0]
    photosensitising: true
    time: pm
    pregnancy: caution
    prescription: false
    potency: 3
    source: "FDA Guidance for Industry: Labeling for Cosmetics Containing Alpha Hydroxy Acids (Jan 2005) — AHAs increase UV sensitivity during use and for up to a week after; FDA Beta Hydroxy Acids page says the same of glycolic acid. Formulation literature puts AHA working range at pH 3.0-4.0, matching ph_range. Pregnancy caution per PMC3114665 / PMC8884185: no human studies, animal adverse reproductive effects at high doses, one review suggesting 10% or below. Escalation added as SKC-004 on 25 Oct 2026. Nothing lactic-acid-specific was found; it is treated as an AHA alongside glycolic acid, which is an inference from class membership."
    review: verified

  - id: mandelic_acid
    name: Mandelic acid
    inci: [Mandelic Acid]
    aliases: []
    class: aha
    ph_range: [3.0, 4.0]
    photosensitising: true
    time: pm
    pregnancy: caution
    prescription: false
    potency: 2
    note: Large molecule, slow penetration. The usual recommendation for sensitive skin that cannot tolerate glycolic.
    source: "FDA Guidance for Industry: Labeling for Cosmetics Containing Alpha Hydroxy Acids (Jan 2005) — AHAs increase UV sensitivity during use and for up to a week after; FDA Beta Hydroxy Acids page says the same of glycolic acid. Formulation literature puts AHA working range at pH 3.0-4.0, matching ph_range. Pregnancy caution per PMC3114665 / PMC8884185: no human studies, animal adverse reproductive effects at high doses, one review suggesting 10% or below. Escalation added as SKC-004 on 25 Oct 2026. As lactic acid, treated by class rather than on mandelic-acid-specific evidence."
    review: verified

  - id: salicylic_acid
    name: Salicylic acid
    inci: [Salicylic Acid]
    aliases: [bha]
    class: bha
    ph_range: [3.0, 4.0]
    photosensitising: true
    time: pm
    pregnancy: caution
    prescription: false
    potency: 3
    note: Oil-soluble, so it works inside the pore rather than on the surface. Pregnancy guidance differs sharply between low-percentage leave-on products and peels.
    source: "PMC9823189 (acne in pregnancy, narrative review): low risk at acne-product concentrations, negligible absorption; avoid large areas, prolonged use, occlusion, damaged skin. PMC12591629: 44 cases of topical salicylate toxicity at the extremes. Reviewed 25 Oct 2026."
    review: verified

  - id: gluconolactone
    name: Gluconolactone
    inci: [Gluconolactone]
    aliases: [pha]
    class: pha
    ph_range: [3.0, 4.5]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 1
    source: "A polyhydroxy acid, larger molecule than an AHA and conventionally described as gentler with less penetration. Recorded as not photosensitising, which is the conventional position but was not separately sourced, and is the one field here worth revisiting if a PHA gate is ever added. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Vitamin C forms ----------------------------------------------------
  - id: l_ascorbic_acid
    name: L-ascorbic acid
    inci: [Ascorbic Acid, L-Ascorbic Acid]
    aliases: [vitamin c, laa]
    class: vitamin_c
    ph_range: [2.5, 3.5]
    photosensitising: false
    time: am
    pregnancy: ok
    prescription: false
    potency: 4
    note: Needs a low pH to penetrate, which is the root of most of its interaction conflicts. Oxidises readily.
    source: "Formulation literature: ascorbic acid is optimally stable around pH 2.5-3.0 and requires pH below 3.5 to penetrate the epidermis, matching ph_range. Oxidation is catalysed by metal ions, especially Cu(II) and Fe(III). Morning timing is a convention tied to its antioxidant role alongside sunscreen rather than a stability requirement. Reviewed 25 Oct 2026."
    review: verified

  - id: sodium_ascorbyl_phosphate
    name: Sodium ascorbyl phosphate
    inci: [Sodium Ascorbyl Phosphate]
    aliases: [sap]
    class: vitamin_c
    ph_range: [6.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 2
    note: Stable derivative at skin-neutral pH. Avoids the low-pH conflicts that L-ascorbic acid creates.
    source: "A vitamin C derivative formulated at near-neutral pH precisely because L-ascorbic acid cannot be. The pH range is a formulation convention; no source was checked for this specific derivative. Reviewed 25 Oct 2026."
    review: reasoned

  - id: thd_ascorbate
    name: Tetrahexyldecyl ascorbate
    inci: [Tetrahexyldecyl Ascorbate]
    aliases: [thd]
    class: vitamin_c
    ph_range: [5.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 3
    source: "As sodium ascorbyl phosphate: an oil-soluble derivative used at near-neutral pH. Range recorded as a formulation convention, unsourced. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Other actives ------------------------------------------------------
  - id: niacinamide
    name: Niacinamide
    inci: [Niacinamide]
    aliases: [vitamin b3]
    class: niacinamide
    ph_range: [5.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 2
    note: Unusually compatible. Most of its reputation for conflicts comes from a widely repeated misreading of a 1960s stability study.
    source: "PMC11047333 and DermNet 'Nicotinamide': niacinamide acts on melanosome transfer with no effect on tyrosinase, raises ceramide production with reduced TEWL, and does not cause the flushing associated with nicotinic acid. Not photosensitising and no pregnancy concern found. Note it can hydrolyse to nicotinic acid in a formulation, which does redden skin — the finding that led to SKA-020 being dropped. Reviewed 25 Oct 2026."
    review: verified

  - id: benzoyl_peroxide
    name: Benzoyl peroxide
    inci: [Benzoyl Peroxide]
    aliases: [bp, bpo]
    class: benzoyl_peroxide
    ph_range: [4.0, 5.5]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 4
    note: An oxidiser. That single property explains every conflict it appears in.
    source: "PMC9823189: benzoyl peroxide is a reasonable first-line option for mild-to-moderate acne in pregnancy; roughly 5% is absorbed and dietary exposure to its metabolite benzoic acid exceeds topical exposure. No published studies in pregnant patients and placental transfer is unknown, but the balance of guidance treats it as low risk rather than a caution. Relaxed from caution on 25 Oct 2026."
    review: verified

  - id: azelaic_acid
    name: Azelaic acid
    inci: [Azelaic Acid]
    aliases: []
    class: azelaic
    ph_range: [4.0, 5.5]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 3
    note: One of the few actives generally considered acceptable in pregnancy, which makes it the usual substitution when retinoids have to come out.
    source: "Repeatedly described in the acne and melasma literature as among the better-tolerated actives, and named as a preferred alternative in pregnancy where hydroquinone is avoided (StatPearls NBK539693). Not photosensitising. Reviewed 25 Oct 2026."
    review: verified

  - id: hydroquinone
    name: Hydroquinone
    inci: [Hydroquinone]
    aliases: [hq]
    class: hydroquinone
    ph_range: [4.0, 6.0]
    photosensitising: true
    time: pm
    pregnancy: avoid
    prescription: true
    potency: 5
    note: Regulated differently across markets; treat presence as a clinician-supervised product.
    source: "StatPearls NBK539693: 35-45% systemic absorption, no demonstrated malformation risk but human evidence is one small study; minimise exposure in pregnancy. Supports escalating rather than forbidding. Reviewed 25 Oct 2026."
    review: verified

  - id: tranexamic_acid
    name: Tranexamic acid
    inci: [Tranexamic Acid]
    aliases: [txa]
    class: tranexamic
    ph_range: [5.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: caution
    prescription: false
    potency: 2
    source: "Pregnancy caution recorded on absence of evidence rather than evidence of harm, which is the honest basis: no pregnancy-specific safety data for topical use was found. PMC12848551 reviews topical efficacy in melasma and PIH but its safety section covers only non-pregnant populations; oral exposure differs and should not be extrapolated. Reviewed 25 Oct 2026."
    review: verified

  - id: alpha_arbutin
    name: Alpha arbutin
    inci: [Alpha-Arbutin, Arbutin]
    aliases: [arbutin]
    class: arbutin
    ph_range: [5.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: caution
    prescription: false
    potency: 2
    source: "Pregnancy caution recorded on absence of evidence rather than evidence of harm, which is the honest basis: no pregnancy-specific safety data for topical use was found. PMC8884185 reports roughly 0.27% dermal absorption for topical 2% arbutin with very minimal systemic distribution, and states explicitly that no reproductive data are available and no recommendation exists. Reviewed 25 Oct 2026."
    review: verified

  - id: sulfur
    name: Sulfur
    inci: [Sulfur, Colloidal Sulfur]
    aliases: []
    class: sulfur
    ph_range: [4.0, 6.0]
    photosensitising: false
    time: pm
    pregnancy: ok
    prescription: false
    potency: 3
    source: "Documented as drying, which is why SKA-071 exists, and conventionally an evening ingredient on cosmetic grounds — it smells. No photosensitivity or pregnancy concern found. The pH range is a formulation convention. Reviewed 25 Oct 2026."
    review: reasoned

  - id: copper_peptides
    name: Copper peptides
    inci: [Copper Tripeptide-1, GHK-Cu]
    aliases: [ghk-cu]
    class: copper_peptide
    ph_range: [5.0, 7.0]
    photosensitising: false
    time: pm
    pregnancy: caution
    prescription: false
    potency: 2
    note: The copper ion is redox-active, which is why it conflicts with strong antioxidants and with low pH.
    source: "Pregnancy caution recorded on absence of evidence rather than evidence of harm, which is the honest basis: no pregnancy-specific safety data for topical use was found. Nothing on copper peptides in pregnancy was found at all. PMC4508379 notes copper bound to the GHK tripeptide has its redox activity silenced and that GHK is prone to hydrolytic cleavage under oxidative stress. Evening timing is a separation convention, not a stability requirement. Reviewed 25 Oct 2026."
    review: verified

  - id: peptides
    name: Signal peptides
    inci: [Palmitoyl Tripeptide-1, Palmitoyl Tetrapeptide-7, Acetyl Hexapeptide-8]
    aliases: [matrixyl, argireline]
    class: peptide
    ph_range: [5.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 1
    source: "A catch-all class for signal peptides other than copper peptides. No gate consequence: not photosensitising, no pregnancy concern found, usable at any time. The pH range is a formulation convention. Reviewed 25 Oct 2026."
    review: reasoned

  - id: urea
    name: Urea
    inci: [Urea]
    aliases: []
    class: humectant
    ph_range: [4.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 2
    note: Humectant at low percentages, keratolytic at high ones, and increases penetration of whatever follows it.
    source: "A humectant whose penetration-enhancing effect is well established and is the basis of SKA-007. No photosensitivity or pregnancy concern found. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Supporting / barrier -----------------------------------------------
  - id: hyaluronic_acid
    name: Hyaluronic acid
    inci: [Sodium Hyaluronate, Hyaluronic Acid]
    aliases: [ha]
    class: humectant
    ph_range: [4.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 1
    source: "A humectant with no gate consequence: not photosensitising, no pregnancy concern, any time of day. The pH range is the range it is formulated across rather than a requirement. Reviewed 25 Oct 2026."
    review: reasoned

  - id: glycerin
    name: Glycerin
    inci: [Glycerin]
    aliases: []
    class: humectant
    ph_range: [4.0, 8.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 1
    source: "As hyaluronic acid. The most common humectant in skincare and the reason detect_suppression ignores it: present in almost everything and matched by no rule. Reviewed 25 Oct 2026."
    review: reasoned

  - id: ceramides
    name: Ceramides
    inci: [Ceramide NP, Ceramide AP, Ceramide EOP]
    aliases: []
    class: ceramide
    ph_range: [4.5, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 1
    source: "Barrier lipids. PMID 33852258 supports ceramide formulations improving barrier measures, which is recorded on SKA-060; the row itself makes no claim beyond class membership and no gate consequence. Reviewed 25 Oct 2026."
    review: reasoned

  - id: panthenol
    name: Panthenol
    inci: [Panthenol, Provitamin B5]
    aliases: [b5]
    class: soothing
    ph_range: [4.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 1
    source: "A soothing agent. PMC12494960 found panthenol among agents measurably reducing retinol-induced irritation, which is recorded on SKA-061. No gate consequence. Reviewed 25 Oct 2026."
    review: reasoned

  - id: centella
    name: Centella asiatica
    inci: [Centella Asiatica Extract, Madecassoside]
    aliases: [cica]
    class: soothing
    ph_range: [4.0, 7.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 1
    source: "A soothing agent, grouped with panthenol. No centella-specific evidence was checked; it is treated by class. No gate consequence. Reviewed 25 Oct 2026."
    review: reasoned

  - id: squalane
    name: Squalane
    inci: [Squalane]
    aliases: []
    class: emollient
    ph_range: [4.0, 8.0]
    photosensitising: false
    time: any
    pregnancy: ok
    prescription: false
    potency: 1
    source: "An emollient with no gate consequence and no interaction rule that fires on it. Present mainly so that products carrying it are recognised rather than left unresolved. Reviewed 25 Oct 2026."
    review: reasoned

  - id: petrolatum
    name: Petrolatum
    inci: [Petrolatum, Mineral Oil]
    aliases: [vaseline, slugging]
    class: occlusive
    ph_range: [4.0, 8.0]
    photosensitising: false
    time: pm
    pregnancy: ok
    prescription: false
    potency: 1
    note: Seals everything beneath it, including actives whose penetration then increases.
    source: "An occlusive. Evening timing and the ordering rule SKA-081 are the only consequences; neither depends on a property of petrolatum beyond being occlusive, which is definitional. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- UV filters ---------------------------------------------------------
  - id: zinc_oxide
    name: Zinc oxide
    inci: [Zinc Oxide]
    aliases: [mineral spf]
    class: uv_filter
    ph_range: [5.0, 8.0]
    photosensitising: false
    time: am
    pregnancy: ok
    prescription: false
    potency: 1
    source: "A mineral UV filter. The row's only load-bearing field is class, which places it last in the morning via SKA-080 and makes SKA-022 fire with vitamin C. Filter efficacy itself is out of scope: this table does not rate sunscreens. Reviewed 25 Oct 2026."
    review: reasoned

  - id: organic_uv_filters
    name: Organic UV filters
    inci: [Avobenzone, Octocrylene, Homosalate, Tinosorb S, Uvinul A Plus]
    aliases: [chemical spf, sunscreen]
    class: uv_filter
    ph_range: [5.0, 8.0]
    photosensitising: false
    time: am
    pregnancy: ok
    prescription: false
    potency: 1
    source: "As zinc oxide: a class marker, not a claim about any particular filter. Reviewed 25 Oct 2026."
    review: reasoned

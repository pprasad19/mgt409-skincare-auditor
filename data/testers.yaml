# What real users found, and what changed because of it.
#
# This file is the single source for the tester evidence in report.html
# and slides.html. Both are generated from it — add a finding here and
# rerun `python build_report.py`, and the narrative, the counts and the
# tables all move together. Typing a finding into the report by hand is
# how the two documents start disagreeing with each other and with the
# repository.
#
# FIELDS
#   tester     which tester, anonymised to a number
#   round      which sitting; a tester who comes back gets a new round
#   reported   their words, as close to verbatim as makes sense
#   layer      where the defect actually lived, which is often not where
#              it appeared
#   wrong      what the app did
#   fixed      what changed
#   commit     the commit that changed it
#   class      the failure class, for the pattern argument in the report
#   caught_by_tests  whether any existing suite would have caught it
#
# The last field is the uncomfortable one and the reason the file has it:
# with ~700 automated checks passing, every single finding below was
# missed by all of them.

testers:
  - id: 1
    recruited: 2026-10-24
    knows: does their own skincare daily; strong domain knowledge
  - id: 2
    recruited: 2026-10-24
    knows: checked the output against the bottles physically in front of them
  - id: 3
    recruited: 2026-10-24
    knows: >-
      Reported 26 Oct. Tested the safety path specifically - declared a
      pregnancy and a prescription, then used the app the way a real user
      would, by pressing Audit again. Found the only defect in this project
      that could have caused harm.

findings:
  # ---- tester 1, round 1: domain knowledge --------------------------
  - tester: 1
    round: 1
    reported: "how can you use a face mask only for 30s? masks are usually used for 10-20 mins"
    layer: schema
    wrong: >-
      The routine told the user to apply a face mask for 30 seconds and move on.
      StepApplication.seconds is capped at 120 and means time spent applying, so
      a fifteen-minute mask was not expressible at all.
    fixed: >-
      Dwell time became a property of the form, set by the engine rather than
      the narrator, and rendered as its own beat in all four surfaces.
    commit: 8acfc4f
    class: unrepresentable-in-the-schema
    caught_by_tests: false

  - tester: 1
    round: 1
    reported: "what happened to a normal cleanser? cleansing oil is part of a double cleansing routine and used at night"
    layer: data
    wrong: >-
      "Cleansing" matched the cleanser keywords before anything noticed the
      "balm", so an oil cleanser was filed as an ordinary cleanser, placed in
      the morning routine, and counted as satisfying the shelf's need for a
      cleanser. Three wrong answers from one missing distinction.
    fixed: >-
      oil_cleanser became its own form — evening only, ranked before cleanser
      rather than instead of it — and the engine overrides the reader on the
      specific phrases, as it already did for UV filters forcing spf.
    commit: 8acfc4f
    class: category-too-coarse
    caught_by_tests: false

  - tester: 1
    round: 1
    reported: "when suggesting what is missing, you should specify what part of day it should be used in"
    layer: presentation
    wrong: A gap named a missing step without saying when to use it.
    fixed: >-
      Every gap now states morning, evening or both, read from the same `times`
      column the routine builder uses, so the two cannot disagree.
    commit: 8acfc4f
    class: incomplete-advice
    caught_by_tests: false

  - tester: 1
    round: 2
    reported: "for face masks, do not assume how long they should be used for. search it online"
    layer: evidence
    wrong: >-
      The fix for the 30-second mask put 600 seconds in the forms table. That
      number came from nowhere — exactly the unsourced figure the rest of the
      project exists to avoid. Clay sets in ten minutes, a sheet mask comes off
      at twenty, an overnight mask stays on all night.
    fixed: >-
      The time is looked up per product and cites its source; for the Aztec clay
      mask that is 15 minutes from aztecsecret.com, not the 10 invented. When no
      time can be found the step says to follow the packet and the guided player
      waits rather than counting down.
    commit: a09d7be
    class: unsourced-number
    caught_by_tests: false

  - tester: 1
    round: 2
    reported: "toners and eye creams should always be listed as an optional item for both routines, and there should always be some type of serum"
    layer: product-judgement
    wrong: >-
      Only cleanser, moisturiser and sunscreen were ever named as missing, on
      the argument that naming anything else would invent a purchase.
    fixed: >-
      Three tiers instead of one — missing, worth considering, optional — so a
      suggestion cannot read as a defect. The risk was never naming them; it
      was naming them as failures.
    commit: a09d7be
    class: advice-too-narrow
    caught_by_tests: false

  # ---- tester 2, round 1: identity ----------------------------------
  - tester: 2
    round: 1
    reported: "I never provided a goodal calming moisture, so where is that coming from"
    layer: agent
    wrong: >-
      find_ingredients was handed a product name, searched, and attached
      whatever came back. The result's ingredient list then became the basis of
      every finding, the routine order and the money.
    fixed: >-
      The lookup fails closed: same_product and matched_brand come back from the
      agent, _brand_conflict checks the brand in code rather than trusting the
      prompt, and an unconfirmed product is reported as unidentified.
    commit: 6807e89
    class: confidently-wrong-identity
    caught_by_tests: false

  - tester: 2
    round: 1
    reported: "the centella cleansing oil is from Skin1004 so why are you saying it is from manyo"
    layer: agent
    wrong: >-
      Same defect as above. A half-legible "centella cleansing oil" returns the
      most famous centella cleansing oil there is.
    fixed: Same fix. The catalogue matcher had refused cross-brand matches since
      the beginning; the web lookup, far less constrained, had no equivalent.
    commit: 6807e89
    class: confidently-wrong-identity
    caught_by_tests: false

  - tester: 2
    round: 1
    reported: "why are you saying that the kiehl's retinol is an eye cream when the packaging does not say that. because of this error, you did not suggest an eye cream to me which you should have"
    layer: agent
    wrong: >-
      Two wrong answers from one misread field, and the tester spotted the
      invisible one: because the shelf appeared to hold an eye product, the
      suggestion to get one was withheld.
    fixed: >-
      The engine refuses `eye` from the reader unless the name mentions the eye.
      The first attempt reused the form keyword phrases and threw away "Youth
      Dose Eye Treatment" and "Eye Repair Cream" — refusing a real one is worse
      than the bug — so the check has its own broader word list.
    commit: 6807e89
    class: error-causing-silence
    caught_by_tests: false

  - tester: 2
    round: 1
    reported: "I only showed a 7ml image of the la mer moisturizer but you included the price of a full sized one"
    layer: schema
    wrong: >-
      The reader transcribed the whole label but had no field for how much was
      in the container, so the lookup was asked for the price of "the standard
      size" and gave it. Off by a factor of twenty, and every figure in the
      money section inherits it.
    fixed: Size is read off the container, carried into the lookup, and shown.
    commit: 6807e89
    class: unrepresentable-in-the-schema
    caught_by_tests: false

  # ---- tester 2, round 2: the fixes not holding ---------------------
  - tester: 2
    round: 2
    reported: "you are still identifying products that are never there like an enzyme powder wash"
    layer: agent
    wrong: >-
      The previous fix was at the wrong layer. It stopped the web lookup
      substituting a product, which was real, but this product never went near
      the lookup — the Shelf Reader invented it while reading the photograph.
      The prompt forbade inventing an ingredient and said nothing about
      inventing a product.
    fixed: >-
      unsupported_names() checks each product's name against the text the reader
      transcribed from that product's own label, the mirror of the check that
      catches a dropped ingredient. It detects rather than deletes.
    commit: 75b5110
    class: fix-at-the-wrong-layer
    caught_by_tests: false

  - tester: 2
    round: 2
    reported: "you are still not using the size of the lamer to find the correct online retail price"
    layer: presentation
    wrong: >-
      The size plumbing was live but invisible: size was read and used silently,
      so when the price came back wrong there was no way to see whether the size
      or the price was at fault, and no way to correct either.
    fixed: >-
      Size is shown and editable and a typed size beats the photograph. A price
      found for a different size is now refused rather than captioned — a wrong
      price is not a rough price.
    commit: 75b5110
    class: invisible-to-the-user
    caught_by_tests: false

  - tester: 2
    round: 2
    reported: "I tried to tell the app what is wrong and should be replaced in the what is missing section but it just added more items to the list even though I was clarifying what wrong actions it did"
    layer: design
    wrong: >-
      Every input the page offered was additive. There was no way to remove
      anything, so a correction typed into the only available box came back as
      another product. This is why the same bug had to be reported twice.
    fixed: >-
      A "Not mine" control that removes a product and keeps it removed across
      rounds. A vision model can be made to invent fewer products and cannot be
      made to invent none, so this is a safety mechanism rather than a
      convenience.
    commit: 75b5110
    class: no-way-to-correct
    caught_by_tests: false

  # ---- tester 2, round 3: the overcorrection -----------------------
  - tester: 2
    round: 3
    reported: "they have a mist from cocokind and gave the quantity, but the app does not tell them the retail price"
    layer: comparison
    wrong: >-
      My own previous fix, overcorrecting. The 7 ml La Mer complaint was a
      full-jar price shown as if it were theirs, so I made a size mismatch
      refuse the price outright — which fixed the wrong number by removing the
      number. Worse, the mismatch was spurious: the lookup HAD found the right
      price, $18 for the 4 fl oz from the brand's own page, and returned the
      size as "4 fl oz / 120 mL" because that is how the bottle is labelled.
      Comparing that to "4 fl oz" as a string called it a different size.
    fixed: >-
      Sizes are compared by measure rather than text — a container is a set of
      (amount, unit) pairs, and one shared measure is agreement. A price for a
      genuinely different size is now shown beside the product with that size
      named inline, and excluded from the totals: visible because they asked
      for it, never presented as theirs, never added up.
    commit: pending
    class: fix-caused-new-bug
    caught_by_tests: false

  - tester: 2
    round: 3
    reported: "this text does not have to wrap around like this"
    layer: presentation
    wrong: >-
      The landing page standfirst carried max-width:46ch, a measure meant for a
      column of body text, and broke one sentence across three lines leaving
      "in." alone on the last.
    fixed: 64ch, plus text-wrap:pretty so a future edit cannot orphan a word.
    commit: pending
    class: typography
    caught_by_tests: false

  # ---- tester 2, round 4 --------------------------------------------
  - tester: 2
    round: 4
    reported: "I provided 2 toners so why are you telling me to use both of them instead of telling me to just choose 1"
    layer: model
    wrong: >-
      build_routine put every product into the slot its form allowed and ordered
      them by rank, so two toners became step 2 and step 3. A routine step was
      always something you do and never something you choose between, so the
      page read as an instruction to apply both.
    fixed: >-
      product_forms.yaml gains one_at_a_time, and the forms flagged collapse to
      a single step naming the alternatives. Not a blanket rule — layering two
      serums is ordinary practice, so serum, treatment, mask, exfoliant and oil
      are deliberately unflagged.
    commit: pending
    class: unrepresentable-in-the-schema
    caught_by_tests: false

  - tester: 2
    round: 4
    reported: "the routine sections only reflect my products, but later you tell me a gentle cleanser should be part of my routine and never incorporate it. for optional items like eye cream, give me the option to include it and then modify the routine"
    layer: design
    wrong: >-
      The routine was built strictly from owned products, so the page asserted
      "you need a cleanser" in one section and showed a routine without one two
      sections above — leaving the reader to work out where it would go, which
      is the question the routine exists to answer.
    fixed: >-
      A placeholder step, placed where the forms table says the step belongs.
      Automatic for a missing essential, opt-in for an optional one. It is
      visibly not a product: no price, no application spec, excluded from the
      animation, the guided player and the printed card, because a timer
      counting down for a product you do not own is an instruction to use it.
    commit: pending
    class: page-contradicts-itself
    caught_by_tests: false

  # ---- tester 1, round 3 --------------------------------------------
  - tester: 1
    round: 3
    reported: "cleansing oil or balm should not be considered optional, it should definitely be included"
    layer: product-judgement
    wrong: >-
      The oil cleanser sat in the "worth considering" tier. Internally
      inconsistent: this app tells every user to wear sunscreen daily, and
      sunscreen is formulated not to come off with water, so recommending it
      and then treating its removal as optional was the page disagreeing with
      itself.
    fixed: >-
      Promoted to an essential, which also gives it a placeholder step in the
      evening routine. Recorded as `reasoned` rather than `verified` — the AAD
      order does not cover double cleansing, so this rests on the app's own
      logic rather than a published source, and the table says so.
    commit: pending
    class: advice-too-narrow
    caught_by_tests: false

  - tester: 1
    round: 3
    reported: "you are not reporting the prices that are directly in the urls that I am giving you"
    layer: agent
    wrong: >-
      The lookup agent has a web search tool rather than a fetcher, so it never
      opens the page the user pasted — it answers from search results about it.
      price_on_page was false on every URL anyone had ever submitted, and the
      money section fell back to a remembered figure or to nothing.
    fixed: >-
      The page is fetched once, with a User-Agent naming this project, and the
      price is read from the schema.org Product block sites publish for exactly
      this purpose. A published price outranks anything the agent inferred.
      Sites that publish none are unchanged. Verified end to end: two pasted
      links now report $18 and $6.
    commit: pending
    class: agent-cannot-do-what-it-claims
    caught_by_tests: false

  - tester: 2
    round: 4
    reported: "for optional items such as eye cream, give me an option to tell you if I want to incorporate it, and then modify the routine"
    layer: design
    wrong: >-
      The page offered a step and gave no way to accept the offer. A reader
      could learn that an eye cream might suit them and had no means of saying
      yes, so the suggestion was the end of the conversation rather than the
      start of one.
    fixed: >-
      A tick box per offered step. Ticking one puts it in the routine in rank
      order, marked as something to buy rather than something owned, and the
      answer survives the round trip. Opt-in rather than shown by default:
      adding an eye cream nobody asked for is the invented-purchase failure
      the three tiers exist to prevent.
    commit: pending
    class: offer-with-no-way-to-accept
    caught_by_tests: false

  - tester: 1
    round: 4
    reported: "toners are also optional so the changes you are making to eye cream should also be made for toners"
    layer: design
    wrong: >-
      Nothing — the opt-in was driven by the tiers table from the start, so
      toner and serum already behaved identically to eye cream. Logged because
      the question was reasonable and the answer was not visible from outside:
      a feature described in terms of one example looks like it was built for
      that example.
    fixed: >-
      Verified rather than asserted, and test_correction now loops over every
      row in the optional and recommended tiers instead of naming forms, so a
      tier that gains a row cannot quietly miss out.
    commit: pending
    class: not-a-defect
    caught_by_tests: true

  # ---- tester 2, round 5 --------------------------------------------
  - tester: 2
    round: 5
    reported: "the audio and animated video do not reflect all the written steps of the routine but it should"
    layer: design
    wrong: >-
      They counted. The written routine had nine steps and the animation showed
      five, because the film walked unique products rather than the routine —
      and both the film and the guided player skipped placeholder steps.
    fixed: >-
      Both walk the routine in full. This reverses a decision made for tester 1,
      who said the GIF repeated itself; the docstring defending it argued the
      film is "a demonstration of a technique, and a technique does not change
      between breakfast and bedtime", which is my argument rather than a user's.
      Both complaints are satisfied at once because they are about different
      things: a product used twice a day plays in full the first time and gets
      one "same again" scene the second, so nothing is missing and no beat is
      drawn twice. Nine written steps, nine player steps, nine film steps.
    commit: pending
    class: surfaces-disagree
    caught_by_tests: false

  - tester: 1
    round: 5
    reported: "this note is not accurate because all of the prices used are retail prices"
    layer: correctness
    wrong: >-
      Two bugs pointing opposite ways, both mine from the same night. A price
      read off the page the user linked was flagged as "what you paid", because
      the page-price fix set price_is_typical = not page_price — but a price on
      a retailer's page is a retail price. And a price the user actually typed
      never cleared the flag, so a carried-over product kept being described as
      typical retail after they had said what it cost. The note also counted its
      denominator over every product rather than over the ones with a price,
      producing "1 of these 7 prices" on a shelf with two prices on it.
    fixed: >-
      The flag now means "we looked this up" and is cleared only by a figure the
      user types. The note counts priced products, and says where the figures
      came from rather than asserting the user failed to supply them.
    commit: pending
    class: confidently-wrong-provenance
    caught_by_tests: false

  # ---- tester 3, round 1 --------------------------------------------
  - tester: 3
    round: 1
    reported: "she is pregnant/trying and indicates an item is prescribed to her; but when she clicks audit again, the app forgets these previous conditions"
    layer: design
    wrong: >-
      The safety gates were not carried through a re-audit. Measured before
      fixing: first pass escalated to a clinician, pressing Audit again did
      not. A pregnant user who corrects a price is silently un-declared and
      then advised on a retinoid. Every other field on that form was carried -
      products, prices, sizes, concerns, dismissals, opted-in steps - and the
      two that gate on safety were the ones missing, because they live on the
      landing page and the re-audit form grew out of the result page.
    fixed: >-
      Carried as visible ticked boxes rather than hidden inputs, so the user
      can see the app still knows and can withdraw it if the answer changed.
      Pinned in test_correction.
    commit: pending
    class: safety-gate-lost
    caught_by_tests: false

  - tester: 3
    round: 1
    reported: "when she says something has been prescribed to her, shouldnt the app ask her what exactly was prescribed to her"
    layer: design
    wrong: >-
      The app guessed, by matching the declaration against ingredients the
      table marks prescription-only. That works for tretinoin and silently
      does nothing for a compounded cream or a prescription-strength version
      of something sold over the counter - the user tells the app something
      important and the page looks exactly as it would have if she had said
      nothing.
    fixed: >-
      A Prescribed box per product. A product she names is escalated whatever
      the table believes about its ingredients, and when she declares a
      prescription and nothing matches, the page asks her to name it.
    commit: pending
    class: declaration-ignored
    caught_by_tests: false

  - tester: 3
    round: 1
    reported: "she lists she uses 2 serums but why are they considered to be duplicate functions"
    layer: presentation
    wrong: >-
      Not a rule error - two serums with different jobs are correctly not
      flagged, and the pair that fires really does share a function. But the
      card said "Keep one" without saying what was duplicated, so the verdict
      arrived with no reason attached and read as the app not understanding
      her shelf.
    fixed: >-
      The card now names the shared ingredients in readable form and says what
      duplicate means here - not that the products are identical, but that she
      is paying twice for one effect.
    commit: pending
    class: verdict-without-reason
    caught_by_tests: false


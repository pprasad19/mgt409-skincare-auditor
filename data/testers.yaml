# Defects found by me, not by a tester - kept apart from `findings` so
# the tester count the report quotes stays a tester count. Both turned
# up in the same ten minutes, in the browser, while checking that the
# price columns a tester had asked for actually worked.
self_found:
  - date: 2026-10-26
    found_while: "checking tester 1's Use it column end to end"
    what: >-
      The hidden field that carries products between rounds serialised six
      of fourteen fields. Everything else came back at its default on the
      next submission, and every default is the benign answer:
      price_is_typical went False, so a figure the tool had looked up
      returned as a price the user had stated and was summed into "on the
      shelf"; size went empty, so a size she had typed to correct a
      sample-versus-full-jar price was gone; prescribed went False, so a
      product she had named as her clinician's stopped being treated as
      one.
    why_it_matters: >-
      The confirmed-price rule was being undone one round later by a
      serialisation detail three hundred lines away. Three testers had
      reported symptoms of this - sizes not sticking, a prescription
      forgotten on re-audit, "all of the prices used are retail prices" -
      and each was fixed at the surface it appeared on.
    fixed: "The carry dumps the whole model. An allow-list is what made it possible."
    caught_by_tests: false

  - date: 2026-10-26
    found_while: "reading the $96 total that should have been $0"
    what: >-
      One fact in two places. The page read price_is_typical on the
      resolution and printed "retail, looked up"; the money rules read
      price_is_typical on the product. The catalogue branch set the first
      and not the second, so six products with no price typed by anyone
      were labelled guesses on the page and totalled $96 above them.
    why_it_matters: >-
      Nothing threw and both numbers were internally consistent. This is
      the project's central pattern in one bug: code met data, and was
      confidently wrong rather than visibly broken.
    fixed: >-
      The branch sets both, and the money rules now read the same flag the
      page renders, so the label and the arithmetic cannot disagree by
      construction. test_thesis asserts the invariant and was checked
      against the reintroduced bug.
    caught_by_tests: false

# A design decision rather than a defect, recorded here because the
# tester evidence is what drove it and the report argues from this row.
decisions:
  - date: 2026-10-26
    question: "should the spoken walkthrough stay?"
    evidence: >-
      "I think the whole audio aspect should be removed, creates more
      confusion than usefulness." Four tester findings landed on it across
      three rounds and each fix produced the next: durations read as "fifty
      ess", a step the user does not own demonstrated without saying so, a
      line that announced an alternating acid on the night it should be
      skipped. It is also the one surface this project cannot test - voice,
      pacing and pronunciation differ per browser and none of it is
      inspectable from Python.
    decided: >-
      Removed: the speech module, its four controls and its status line. Kept:
      DATA_STEPS and guided mode, which is the on-screen walkthrough for
      standing at a sink and never spoke; the film; the printed card. The
      durations still come from beats_for, so the surfaces that remain cannot
      disagree, and tools/four_surfaces.py still compares four renderings
      because DATA_STEPS fed both the guided player and the speech.
    cost: >-
      No hands-free option. The honest accounting is that it was never
      hands-free in practice - it needed the page open and a browser whose
      voice engine behaved - and three testers spent four findings telling me
      so.
  - date: 2026-10-26
    question: "should the 40-product cap come down to 15, to avoid errors?"
    evidence: >-
      MAX_PRODUCTS is an abuse ceiling in limits.py - a page that calls a
      vision model needs a bound on how much work a stranger can hand it.
      It truncates after the read, with a visible note. Lowering it would
      not have prevented any of the 38 tester findings: every round was a
      handful of products, and the error-prone paths are bounded
      separately at 8 photographs and 6 web lookups per audit, which is
      where the wrong-product and wrong-price findings came from. A
      40-product shelf gets 6 lookups, the same as a 6-product one.
    decided: >-
      Keep the cap; fix the claim. The landing page was printing the
      ceiling as a promise - "Up to 40 products" - and no shelf near forty
      has ever been run through this tool, so the accuracy of a reader
      asked for forty products across eight photographs is unmeasured. A
      number nobody has tested, stated as a capability, is the defect this
      report spends a section on. The copy now reads "built for a bathroom
      cabinet's worth; it has only been tried on small shelves", and
      limits.py names the number in the truncation note, which is where a
      limit belongs: in what happens, not in what is promised.
    cost: >-
      Someone with a very large shelf gets less warning up front, and
      learns the bound from the note if they hit it.
  - date: 2026-10-26
    question: "is the 'in high-severity conflict' money tile needed, or can it go?"
    evidence: >-
      The tile priced the products involved in a critical or high-severity
      clash. Nobody asked for it and it answers no question a reader has: the
      conflict section already says what clashes and what to do, and putting
      a dollar figure on it implies the money is lost, which it is not - the
      products are usable, just not together.
    decided: >-
      Removed from the page, the agent brief and the CLI. The field stays on
      the model with a comment saying why, since the arithmetic is sound and
      taking it out of the schema would be a migration for no gain.
    cost: >-
      One fewer number on the page. The three remaining tiles are on the
      shelf, unused, and duplicate function.

  - date: 2026-10-26
    question: "does this app need to account for cost, or should it just give a good routine?"
    evidence: >-
      8 of 30 tester findings were about price, and every one was about a
      figure the app had guessed - a full-size price against a 7 ml sample,
      an Amazon listing it cannot read, an original where the page showed a
      sale, a retail estimate described as what they paid. None was about the
      feature existing.
    decided: >-
      Keep the money section; stop it guessing. A price is counted only if the
      user typed it. Looked-up figures stay visible beside each product,
      labelled with where they came from, and are never summed; a shelf with
      no confirmed prices says so and asks. This retires the whole defect
      class instead of fixing instances, and keeps the quantified-impact axis
      the project's motivation rests on.
    cost: >-
      Most users now see "nothing to add up yet" where they previously saw a
      number. A weaker first impression in exchange for every displayed figure
      being one the user can check.


# Non-English ingredient names, mapped to ingredient ids in ingredients.yaml.
#
# WHY THIS FILE EXISTS
# INCI nomenclature is international, so most non-English labels already carry
# terms the main table matches — a Korean or French product listing "Niacinamide"
# needs nothing from this file. It covers the cases where a label uses local
# names instead: common on Japanese and Chinese packaging, and on the marketing
# face of Korean products.
#
# RISK, AND WHY IT IS DIFFERENT FROM THE RULES
# A missing alias means a product resolves to fewer actives — the system says
# less than it could, which is safe. A WRONG alias means a product resolves to
# an active it does not contain, and the user is then warned about a conflict
# that does not exist, or worse, reassured about one that does. False positives
# here are more damaging than false negatives.
#
# These translations have NOT been checked by a speaker of each language. They
# are the lowest-confidence data in the project. Before relying on any language
# below, have someone who reads it check that column; until then, treat findings
# that depend on a translated match as provisional.
#
# Only the actives where a local-language name is actually common are listed.
# Solvents and emulsifiers are omitted — the table has no opinion on them.


# Non-English ingredient names, mapped to ingredient ids in ingredients.yaml.
#
# WHY THIS FILE EXISTS
# INCI nomenclature is international, so most non-English labels already carry
# terms the main table matches — a Korean or French product listing
# "Niacinamide" needs nothing from here. This covers labels that use local
# names instead: standard on Japanese and Chinese packaging, and on the Korean
# ingredient lists that transliterate INCI into Hangul.
#
# French is sparse on purpose. EU regulation requires INCI on the ingredient
# list, so a French product's actives are already in a form the table matches.
# What French needs is form keywords (crème, eau micellaire, lait démaquillant),
# which live in rules.py, not here.
#
# RISK, AND WHY IT DIFFERS FROM THE RULES TABLE
# A missing alias means a product resolves to fewer actives: the system says
# less than it could, which is safe. A WRONG alias means a product resolves to
# an active it does not contain, so the user is warned about a conflict that
# does not exist — or reassured about one that does. False positives here are
# more damaging than false negatives, which is why short ambiguous terms are
# left out even where they are technically correct.
#
# STATUS: unverified. Not checked by a speaker of any of these languages.
# `python build_db.py` prints per-language coverage so gaps are visible rather
# than assumed. Before relying on a language, have someone read that column.

aliases:


# Interaction rules. Every claim the auditor makes cites one of these rule_ids.
#
# RULE IDS
#   SKA-nnn   skincare audit rule. An interaction between two products the
#             user owns. Produces a finding, never a gate.
#   SKC-nnn   skincare contraindication. A gate: it routes the audit to a
#             clinician instead of answering. Numbered separately because
#             the two do different things and a reader of the output page
#             should be able to tell which kind of claim they are looking at
#             from the id alone.
#
# PROVENANCE — same warning as ingredients.yaml. Drafted from general
# knowledge, then reviewed row by row on 25 Oct 2026. The project's claim is
# that advice is auditable, which is only true if the table is audited.
#
#   review: verified   checked against a published source, named in `source`
#   review: reasoned   reviewed, no published source found for this specific
#                      pairing, kept on the mechanism recorded in `source`
#   review: pending    nobody has looked
#
# Most interaction rules are claims about two ingredients together, and the
# literature tests single ingredients far more often than pairs. `reasoned`
# exists so that distinction survives into the output: only `verified` sets
# the flag the result page uses to present a claim as settled.
#
# SELECTORS
#   class:<name>  matches any ingredient of that class
#   ing:<id>      matches one specific ingredient
#   A rule where a == b fires when two DIFFERENT products both match it.
#
# TYPE
#   conflict     should not be used together as the user currently does
#   caution      workable, but needs care or a lower frequency
#   synergy      better together than apart — worth telling people
#   myth         widely believed, not supported. Stated so users stop avoiding
#                it. NOTE: the table currently holds no myth rules. SKA-020
#                was the only one and was removed on 25 Oct 2026 when its
#                supporting study could not be found. The type is kept
#                because the shape is right, not because it is in use.
#   redundancy   duplicate function, money being spent twice
#
# RESOLUTION
#   separate_am_pm | alternate_nights | buffer | reorder | drop_one | none

interactions:

  # ---- Retinoid conflicts -------------------------------------------------
  - rule_id: SKA-001
    a: class:retinoid
    b: class:aha
    type: conflict
    severity: medium
    mechanism: >-
      Both increase cell turnover and both disrupt the barrier, so using them in
      the same session can irritate more than either alone. How much is very
      individual: an open study of 397 women using retinaldehyde with 6% glycolic
      acid found the combination well tolerated, and no trial compares alternate
      nights with nightly use for the pair. Treat this as a tolerance question,
      not a chemical incompatibility.
    guidance: >-
      Fine together for many people. If either one stings, flakes or reddens your
      skin, move them to different nights before giving either up.
    resolution: none
    source: "DermNet 'Topical therapy for acne' supports alternate nights as a tolerability strategy for retinoids alone, not for the combination. PMID 19192015: 397-woman open study of 0.1% retinaldehyde with 6% glycolic acid, highly tolerated, side-effect complaints rare. No controlled trial of alternate-night versus nightly dosing for the pair was found. Downgraded from high to medium on 25 Oct 2026 because the evidence does not support separating them by default."
    review: verified

  - rule_id: SKA-002
    a: class:retinoid
    b: class:bha
    type: conflict
    severity: medium
    mechanism: >-
      Same additive irritation as with AHAs, usually milder because salicylic acid
      works inside the pore rather than across the whole surface.
    guidance: Alternate nights, or move the BHA to the morning if tolerated.
    resolution: alternate_nights
    source: "No controlled data on stacking a BHA with a retinoid. Each is independently documented as disrupting the lipid barrier and raising transepidermal water loss, and stratum corneum thinning from faster turnover is documented as reducing barrier protection. The combination is mechanistic inference from those, not a tested claim. Severity is medium rather than high for that reason. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKA-003
    a: class:retinoid
    b: ing:benzoyl_peroxide
    type: conflict
    severity: high
    mechanism: >-
      Benzoyl peroxide is an oxidiser and most retinoids oxidise readily. Applied
      together, a measurable fraction of the retinoid is degraded before it acts,
      so the more expensive product is the one being wasted.
    guidance: Separate them — benzoyl peroxide in the morning, retinoid at night.
    resolution: separate_am_pm
    except_ingredients: [adapalene]
    source: "Martin B et al., Br J Dermatol 1998 (PMID 9990414): tretinoin 0.025% gel with 10% benzoyl peroxide under light lost 50% in 2h, 95% in 24h. In vitro, two products mixed; degradation attributed to peroxide plus light, so this rule should not claim it happens in the dark. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKA-004
    a: ing:adapalene
    b: ing:benzoyl_peroxide
    type: synergy
    severity: low
    mechanism: >-
      Adapalene is photostable and oxidation-resistant, unlike other retinoids, and
      the two are co-formulated in prescription products. This is the documented
      exception to SKA-003.
    guidance: Safe to use together. Combination products exist for exactly this reason.
    resolution: none
    source: "PMID 9990414: adapalene showed no degradation over 24h under the same conditions. PMC3956794 meta-analysis repeats that adapalene is stable with benzoyl peroxide in light. Co-formulated adapalene/BPO products are sold. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKA-005
    a: class:retinoid
    b: ing:l_ascorbic_acid
    type: caution
    severity: medium
    mechanism: >-
      L-ascorbic acid needs a pH near 3 and retinoids work closer to 5.5. Layered
      directly, neither sits in its effective range, and the combined acid load
      irritates.
    guidance: Vitamin C in the morning, retinoid at night. They are not incompatible, just badly matched in one session.
    resolution: separate_am_pm
    source: "Formulation literature: ascorbic acid is optimally stable around pH 2.5-3.0 and needs pH below 3.5 to penetrate, while retinol is chemically unstable below pH 5 and acidic conditions promote retinoid dimerisation, which antioxidants and packaging do not prevent. The pH ranges are genuinely incompatible. Sources are patent and formulator texts rather than peer-reviewed stability studies; no head-to-head comparison of separation strategies was found. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKA-006
    a: class:retinoid
    b: class:retinoid
    type: redundancy
    severity: medium
    mechanism: >-
      Two retinoids do not compound the benefit but do compound the irritation.
      This frequently happens by accident, because retinyl palmitate appears in
      moisturisers that are not marketed as retinoid products.
    guidance: Keep the stronger one. Check moisturiser labels for a second retinoid you did not know about.
    resolution: drop_one
    source: "Partly definitional. Two retinoids deliver the same mechanism, and retinoid irritation is documented as dose-dependent, so compounding dose without compounding benefit follows. The practical claim that this happens by accident through retinyl palmitate in moisturisers is an observation about product formulation, not a studied effect. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKA-007
    a: class:retinoid
    b: ing:urea
    type: caution
    severity: low
    mechanism: Urea increases penetration of what follows it, which raises both the effect and the irritation of a retinoid.
    guidance: Workable, but introduce slowly and watch for stinging.
    resolution: none
    source: "Urea's penetration-enhancing effect is well established and retinoid irritation is dose-dependent, so raising delivery raising irritation follows. No study tests urea with a retinoid specifically. Kept at low severity as mechanistic inference. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Acid conflicts -----------------------------------------------------
  - rule_id: SKA-010
    a: class:aha
    b: class:bha
    type: caution
    severity: medium
    mechanism: >-
      Combined exfoliation easily exceeds what the barrier can repair between
      uses. Tolerable for some skin, but it is the most common cause of the
      over-exfoliation state users mistake for sensitivity.
    guidance: Use on different days unless your skin has clearly tolerated both together.
    resolution: alternate_nights
    source: "No controlled data on combining an AHA with a BHA. AHAs at peeling concentrations are documented to disrupt corneocyte cohesion and irritate, and the barrier takes time to repair between exposures, so combined exfoliation exceeding repair capacity follows mechanically. Not demonstrated. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKA-011
    a: class:aha
    b: class:aha
    type: redundancy
    severity: medium
    mechanism: Two AHA products do the same job. The second one is spend without additional benefit, and raises irritation.
    guidance: Keep one. Mandelic if your skin is reactive, glycolic if it is not.
    resolution: drop_one
    source: "Definitional rather than empirical: two AHA products perform the same exfoliating function, so the second is duplicated spend. The added-irritation half rests on the same dose reasoning as the other stacking rules and is not separately tested. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKA-012
    a: class:aha
    b: ing:benzoyl_peroxide
    type: caution
    severity: medium
    mechanism: Acid-driven barrier disruption plus an oxidiser is a reliable route to irritation.
    guidance: Separate by time of day.
    resolution: separate_am_pm
    source: "Acid-driven barrier disruption and oxidative irritation from benzoyl peroxide are each documented; the combination is not tested. Benzoyl peroxide is separately documented as oxidising salicylic acid in solution, which supports the general principle that it reacts with other actives. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Vitamin C ----------------------------------------------------------
  - rule_id: SKA-022
    a: ing:l_ascorbic_acid
    b: class:uv_filter
    type: synergy
    severity: low
    mechanism: >-
      Topical vitamin C neutralises free radicals that form in skin despite
      sunscreen. The two protect against different parts of the same damage.
    guidance: Vitamin C in the morning under sunscreen is the ideal pairing.
    resolution: none
    source: "Topical vitamin C's photoprotective action is documented in vitro, including reducing UV-triggered collagen-degrading pathways, and sunscreen filters UV before it reaches skin, so the two act at different points. No clinical trial quantifies the combined benefit, and the in-vitro findings do not establish clinical effect. Low severity synergy. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKA-023
    a: class:vitamin_c
    b: class:vitamin_c
    type: redundancy
    severity: low
    mechanism: Multiple vitamin C products deliver the same antioxidant action at additional cost.
    guidance: Keep one. A stable derivative if the L-ascorbic acid stings or oxidises before you finish it.
    resolution: drop_one
    source: "Definitional, as SKA-011. Multiple vitamin C products deliver the same antioxidant action; this is a spending observation rather than a chemical claim. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Copper peptides ----------------------------------------------------
  - rule_id: SKA-030
    a: class:copper_peptide
    b: class:aha
    type: conflict
    severity: medium
    mechanism: Low pH destabilises the peptide-copper complex, so the peptide product stops doing what it was bought for.
    guidance: Separate by time of day or alternate nights.
    resolution: separate_am_pm
    source: "Ascorbic acid and peptide-copper chemistry both depend on pH, and low pH destabilising a peptide-copper complex is chemically reasonable, but nothing found tests a copper peptide with an AHA. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKA-031
    a: class:copper_peptide
    b: class:retinoid
    type: caution
    severity: low
    mechanism: Commonly separated on stability grounds, though the evidence is thinner than for the vitamin C interaction.
    guidance: Alternate nights if you want to be careful. Low confidence rule.
    resolution: alternate_nights
    source: "The rule already describes its own evidence as thin and that is accurate: nothing found tests copper peptides with retinoids. Retained at low severity as a separation convention rather than a demonstrated interaction. Note that the related SKA-021 was removed because copper bound to the GHK tripeptide has its redox activity silenced, which weakens mechanistic arguments about copper peptides generally. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Benzoyl peroxide ---------------------------------------------------
  - rule_id: SKA-040
    a: ing:benzoyl_peroxide
    b: ing:hydroquinone
    type: conflict
    severity: medium
    mechanism: Together these can produce temporary staining or uneven darkening of the skin — the opposite of the intended effect.
    guidance: Do not layer. Use at different times of day.
    resolution: separate_am_pm
    source: "Benzoyl peroxide is documented as a strong oxidiser that releases free radical oxygen species and oxidises other actives. Hydroquinone is an easily oxidised phenol. Temporary staining from the pair is widely reported but no published source for it was found. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKA-041
    a: ing:benzoyl_peroxide
    b: class:vitamin_c
    type: caution
    severity: medium
    mechanism: An oxidiser applied with an antioxidant. Each works against the other.
    guidance: Separate by time of day.
    resolution: separate_am_pm
    source: "An oxidiser applied with an antioxidant, each documented as such, and benzoyl peroxide is separately documented oxidising salicylic acid in solution. The specific pairing with vitamin C is not tested. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Niacinamide synergies ----------------------------------------------
  - rule_id: SKA-050
    a: ing:niacinamide
    b: class:retinoid
    type: synergy
    severity: low
    mechanism: >-
      Niacinamide supports barrier lipid production, which measurably reduces the
      irritation that causes most people to abandon a retinoid in the first weeks.
    guidance: Good pairing. Applying niacinamide first can make a retinoid easier to tolerate.
    resolution: none
    source: "PMC13036733 and PMC11047333: niacinamide combined with retinoids eases the irritation that is a common reason patients stop, improving adherence; a 5% niacinamide omega-ceramide cream eased xerosis and irritation from oral isotretinoin. 2% niacinamide twice daily for four weeks raised ceramide levels with reduced TEWL. Evidence is small, mostly open-label trials. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKA-051
    a: ing:niacinamide
    b: ing:tranexamic_acid
    type: synergy
    severity: low
    mechanism: The two interrupt pigment transfer by different mechanisms, so the effect on uneven tone is additive.
    guidance: Effective combination for pigmentation.
    resolution: none
    source: "The mechanistic rationale is well established: melanin production and melanosome transfer are separate steps, and niacinamide acts on transfer with no effect on tyrosinase, so combining it with an agent acting elsewhere in the pathway is reasonable. No head-to-head melasma trial quantifies the benefit, and a reconstructed-skin model found a transfer inhibitor plus a tyrosinase inhibitor fell short of full additivity. The mechanism text was corrected on 25 Oct 2026 to drop the claim that the effect is additive. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKA-052
    a: ing:alpha_arbutin
    b: class:vitamin_c
    type: synergy
    severity: low
    mechanism: Both act on pigment production at different points in the pathway.
    guidance: Reasonable to use together.
    resolution: none
    source: "As SKA-051: acting at different points in the pigment pathway is a sound rationale for combining, but additivity was specifically not observed in a reconstructed-skin model and no trial quantifies it. Wording corrected to drop 'additive'. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Barrier support ----------------------------------------------------
  - rule_id: SKA-060
    a: class:ceramide
    b: class:retinoid
    type: synergy
    severity: low
    # Only meaningful for a product that stays on the skin. Ceramides in a
    # cleanser are rinsed off before they can rebuild anything.
    forms: [moisturiser, serum, treatment, oil, occlusive, essence]
    mechanism: Retinoids transiently impair the barrier; ceramides supply the lipids needed to rebuild it.
    guidance: Apply the ceramide moisturiser after the retinoid.
    resolution: none
    source: "PMID 33852258 and PMC11047333: ceramide-containing routines reduced UV-induced erythema and pigmentation and improved hydration; niacinamide-driven ceramide increases correlate with reduced TEWL and better barrier function. Retinoid-induced irritation is itself documented as lipid-barrier disruption with raised TEWL, so supplying barrier lipids addresses the documented mechanism. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKA-061
    a: class:soothing
    b: class:aha
    type: synergy
    severity: low
    forms: [moisturiser, serum, treatment, essence, toner]
    mechanism: Reduces the inflammatory response to exfoliation without blocking the exfoliation itself.
    guidance: Useful alongside an acid routine.
    resolution: none
    source: "PMC12494960 shows soothing agents including ceramides and panthenol measurably reduce 0.1% retinol-induced irritation in a patch test. Extending that from retinol to AHA irritation is inference: the inflammatory response differs. Low severity. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Over-exfoliation / total load --------------------------------------
  - rule_id: SKA-070
    a: class:azelaic
    b: class:retinoid
    type: caution
    severity: low
    mechanism: Both can irritate, though azelaic acid is among the better-tolerated actives.
    guidance: Usually fine. Introduce one at a time.
    resolution: none
    source: "Azelaic acid is repeatedly described as among the better-tolerated actives, and retinoid irritation is documented. No study pairs them. Low severity reflects that this is the mildest of the irritation-stacking rules. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKA-071
    a: ing:sulfur
    b: class:retinoid
    type: caution
    severity: medium
    mechanism: Both are drying. Together they frequently push skin past the point where it can repair overnight.
    guidance: Alternate nights.
    resolution: alternate_nights
    source: "Sulfur and retinoids are each documented as drying. The combination is not tested. Kept at medium rather than high on the same reasoning as the other stacking rules. Reviewed 25 Oct 2026."
    review: reasoned

  # ---- Ordering and timing ------------------------------------------------
  - rule_id: SKA-080
    a: class:uv_filter
    b: "*"
    type: ordering
    severity: high
    mechanism: >-
      Sunscreen forms a continuous film. Anything applied over it disrupts that
      film, and the stated protection no longer holds.
    guidance: Sunscreen is always the last morning step.
    resolution: reorder
    source: "AAD, 'Should I apply my skin care products in a certain order?' and 'Dermatologist-recommended skin care for your 20s': sunscreen after other skincare, beneath makeup. NOTE the mechanism is NOT film disruption: PMID 41478343 found sunscreen efficacy unaltered whether applied before or after other topicals. PMC5874020 shows quantity dominates, a single application giving an effective SPF of ~3.2 from an SPF 50 product. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKA-081
    a: class:occlusive
    b: "*"
    type: ordering
    severity: medium
    mechanism: An occlusive seals the skin. Applied too early it blocks everything that follows from reaching it.
    guidance: Occlusives go last at night.
    resolution: reorder
    source: "AAD skincare layering guidance places an occlusive last, after other skincare. The mechanism recorded here is the ordering consequence rather than a measured blocking effect; as with SKA-080, a study of sunscreen applied before or after other topicals found efficacy unchanged, so 'seals the skin' should be read as the reason for the published order, not as a demonstrated barrier to absorption. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKA-082
    a: class:aha
    b: "*"
    type: timing
    severity: high
    mechanism: >-
      Exfoliating acids increase UV sensitivity for some days after use. Used in
      the morning without reliable sunscreen they raise the risk of exactly the
      pigmentation and photoageing they are meant to address.
    guidance: Use at night, and wear sunscreen daily.
    resolution: separate_am_pm
    source: "DailyMed tretinoin prescribing information: 'Tretinoin gel can cause photosensitivity. Advise patients to avoid or minimize unnecessary exposure to UV light.' Label text, for tretinoin; extension to OTC retinol is an inference. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKA-083
    a: class:retinoid
    b: "*"
    type: timing
    severity: high
    mechanism: Retinoids degrade in UV light and increase photosensitivity.
    guidance: Night use only, with daily sunscreen.
    resolution: separate_am_pm
    source: "FDA, Guidance for Industry: Labeling for Cosmetics Containing Alpha Hydroxy Acids (Jan 2005): AHAs increase UV sensitivity during use and for up to a week after. Guidance, not binding regulation. FDA Beta Hydroxy Acids page says the same of glycolic acid. Reviewed 25 Oct 2026."
    review: verified

# Contraindications route to a human. They are gates, never advice.
contraindications:

  - rule_id: SKC-001
    condition: pregnancy
    matches: class:retinoid
    severity: critical
    message: >-
      Topical retinoids are conventionally avoided during pregnancy. This product
      should be reviewed with your clinician before use.
    action: escalate
    source: "Malta Medicines Authority review of topical retinoids in pregnancy: systemic exposure after topical application is negligible and unlikely to affect a foetus, and contraindication in pregnancy is nonetheless recommended as a precaution. Escalating to a clinician rather than refusing is the behaviour that matches a precautionary convention. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKC-002
    condition: pregnancy
    matches: ing:hydroquinone
    severity: critical
    message: Hydroquinone use in pregnancy should be decided with a clinician.
    action: escalate
    source: "StatPearls NBK539693, as for the hydroquinone ingredient row. Escalation rather than refusal is the supported behaviour. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKC-003
    condition: pregnancy
    matches: class:bha
    severity: high
    message: >-
      Guidance for salicylic acid in pregnancy differs between low-percentage
      leave-on products and peels. Worth confirming with your clinician.
    action: escalate
    source: "PMC9823189 and PMC12591629, as for the salicylic_acid ingredient row. The leave-on versus peel distinction is about dose and area, and holds. Reviewed 25 Oct 2026."
    review: verified

  - rule_id: SKC-004
    condition: pregnancy
    matches: class:aha
    severity: high
    message: >-
      Guidance for alpha hydroxy acids in pregnancy depends on strength and how
      much skin they cover. Worth confirming with your clinician.
    action: escalate
    source: "PMC3114665 / PMC8884185: no human pregnancy studies for topical AHAs; animal studies show adverse reproductive effects at doses far above cosmetic use; one review suggests limiting to 10% or below in pregnancy. Added 25 Oct 2026 because salicylic acid escalated through SKC-003 while glycolic, lactic and mandelic acid escalated through nothing, despite a thinner evidence base than the BHA they sat beside."
    review: verified

  - rule_id: SKC-010
    condition: prescription_product
    matches: prescription:true
    severity: critical
    message: >-
      This product was prescribed for you. Any change to how it is used belongs
      with the clinician who prescribed it, not with this tool.
    action: escalate
    source: "A design decision, not a factual claim. A prescribed product was chosen by a clinician who knows things this tool does not, so any change to how it is used belongs with them. The alternative, letting generated advice override a prescription, is the single worst thing this system could do. Recorded as reasoning rather than sourced. Reviewed 25 Oct 2026."
    review: reasoned

  - rule_id: SKC-011
    condition: declined_to_say
    matches: class:retinoid
    severity: high
    message: >-
      Routing to the cautious path because contraindication information was not
      provided. This is the intended behaviour, not a failure.
    action: escalate
    source: "A design decision, not a factual claim. When contraindication information was not provided, the cautious path is taken rather than assuming absence of a condition. Stated in the message so the user knows it is intended behaviour and not a failure to answer. Reviewed 25 Oct 2026."
    review: reasoned
